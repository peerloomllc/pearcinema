# PearCinema release configuration.
#
# Sourced with `set -a` by scripts/release.sh, then scripts/.env is sourced AFTER
# this so secrets always win. See /home/tim/peerloomllc/RELEASE-PIPELINE.md for the
# canonical step order this file feeds.
#
# NOTHING SECRET BELONGS HERE. This file is committed; scripts/.env is not.

APP_NAME=PearCinema                          # Display name (used in logs, Nostr posts)
BUNDLE_ID=com.pearcinema                     # iOS bundle ID and Android package name
ARTIFACT_PREFIX=pearcinema                   # Prefix for APK/AAB filenames (e.g. pearcinema-v0.1.0.apk)

# NEITHER ios/ NOR android/ IS COMMITTED HERE, which is the suite default and differs
# from PearTune (it commits android/). `expo prebuild` generates both from app.json plus
# plugins/, so these paths only exist after a prebuild - and anything not written into
# app.json is silently dropped by the next one. That is not a theory: the iPhone asked
# for the local network with no purpose string until 2026-08-25 because the string lived
# nowhere. test/app-config.test.js now pins what must survive.
XCODE_WORKSPACE=ios/PearCinema.xcworkspace
XCODE_SCHEME=PearCinema
XCODE_PROJECT=ios/PearCinema.xcodeproj/project.pbxproj
IOS_PROVISIONING_PROFILE="PearCinema Distribution"

KEY_ALIAS_DEFAULT=pearcinema

# The Mac mini builds every iOS artifact. Like PearTune this is an rsync TARGET rather
# than a git clone - scripts/ios-device-build.sh pushes the tree there and builds it.
MAC_MINI_REPO_PATH="pearcinema-ios"

APP_TAGLINE="Your film and television collection, playable anywhere, without exposing your server to the internet."
APP_WEBSITE=https://peerloomllc.com/pearcinema/
NOSTR_HASHTAGS="#PearCinema #P2P #selfhosted #video #movies #privacy #jellyfin #Android #iOS"

# Screenshots.
#
# THE iOS SIMULATOR MUST BE A **PRO MAX**, AND THAT IS NOT A PREFERENCE. App Store
# Connect's iPhone upload slots are 6.9" (1320x2868) and 6.7" (1290x2796). A 6.3"-class
# simulator (iPhone 16 Pro, 1206x2622) renders frames the store has no slot for - PearTune
# discovered that on 2026-07-31 with six perfectly good screenshots already captured at
# the wrong size. ASC also rejects RGBA, so the alpha simctl writes must be stripped.
#
# CREATED 2026-08-25 and VERIFIED BY SCREENSHOTTING IT: an iPhone 16 Pro Max on iOS 26.5
# renders 1320x2868 natively, which is the 6.9" slot exactly. The standing PearCinema-Test
# simulator is an iPhone 16 - the 6.1" class, 1179x2556 - so every frame it produces is a
# size the store has no slot for. That is PearTune's mistake, avoided here before any
# frame was captured rather than after six of them.
IOS_SCREENSHOT_DEVICES="PearCinema-Shots|89403FF2-8E4E-4EB1-B6CC-30959DAEC3DC"

# Play caps a screenshot's long side at 2x its short side (1080x2424 is 2.24 and would be
# refused) and wants 24-bit PNG rather than the RGBA screencap writes. PAD rather than
# crop - cropping eats the navbar.
ANDROID_APP_ID="com.pearcinema.debug"
ANDROID_MAIN_ACTIVITY="com.pearcinema.debug/com.pearcinema.MainActivity"
ANDROID_SCREENSHOT_AVDS="Pixel_9"

# ---------------------------------------------------------------------------
# PearCinema ships a HOST, not a seeder - the same shape as PearTune and unlike the rest
# of the suite. A seeder is an optional extra replica for a phone-to-phone app; a host is
# the sole source of the films, so without it there is nothing to play. The steps occupy
# the same numbered slots because the shape is the same (build an artifact for a machine,
# push an image, publish a store listing), and the skip flag is --skip-host.
# ---------------------------------------------------------------------------

# Step 5b - the desktop tray host (Electron). AppImage + .deb on Linux, NSIS .exe on
# Windows, .dmg on macOS (must build ON the Mac; electron-builder cannot target macOS
# from Linux). electron-builder names the artefacts from productName, which is
# "PearCinema" here.
DESKTOP_DIR=desktop
DESKTOP_BUILD_LINUX="npm run build:linux"
DESKTOP_BUILD_WINDOWS="npm run build:windows"
DESKTOP_BUILD_MAC="npm run build:mac"

# Step 5c - the multi-arch host image (amd64 + arm64), which the Umbrel app runs.
#
# BOTH ARCHITECTURES ALWAYS. Umbrel Home is x86_64 and a Pi-class Umbrel is arm64, and
# until 2026-08-24 the arm64 half could not be built AT ALL: the image installed Intel's
# VA driver unconditionally and apt ends an arm64 build with "no installation candidate".
# Nobody noticed because nobody had ever built one.
HOST_IMAGE=ghcr.io/peerloomllc/pearcinema-host
HOST_IMAGE_BUILD="bash host/build-image.sh"

# Step 13c - the Umbrel community store listing, PUBLISHED since 2026-08-24 and installed
# on a real box. `scripts/sync-umbrel-store.sh` copies umbrel/ into the store checkout
# wholesale and refuses an image that is not pinned by digest or a version that would go
# backwards - the two ways PearTune's hand-syncing drifted.
UMBREL_DIR=umbrel

# NO STARTOS / START9 STEPS, and no start9/ tree to build one from. PearTune's reasoning
# applies here with more force rather than less: StartOS puts each service behind a
# container NAT that holepunching cannot cross, so every byte relays - and a relayed byte
# costs far more for video than for music.
#
# So this app has NO step 5d (.s9pk build) and NO step 7b (StartOS registry refresh). Per
# the pipeline contract those numbers are SKIPPED, never reused or renumbered - the gap is
# how check-release-pipeline.sh tells "absent" from "misplaced".
