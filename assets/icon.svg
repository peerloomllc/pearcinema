<!-- PearCinema's mark. The suite's pear with a film reel where PearTune puts an
     equaliser: same fruit, same leaf and stem, same silver-rimmed window in the
     belly, so the two read as one family and not one app twice.

     Drawn by Recraft from a prompt, then cleaned by hand: squared onto its own
     canvas (the generated file was 4:3 and carried preserveAspectRatio="none",
     which would have stretched the pear out of shape in any square box), warmed
     from a plum background to the family's #171410, and the stem recoloured
     from silver to the pear's own amber. Provenance metadata stripped.

     THIS IS THE ONLY COPY. Every PNG, .ico and tray shape is generated from it
     by `npm run build:icons`, and the dashboard's favicon is inlined from it at
     build time. Edit here, run that, commit what changes. -->
