manifestVersion: 1
id: peerloom-pearcinema
name: PearCinema
# Hosted on the website because umbrelOS falls back to its OFFICIAL-apps gallery CDN
# when this field is missing, which 404s for community-store apps - and the listing
# then shows a generic tile. PearTune has carried this note since it shipped; this app
# simply never got the field, so its icon was blank from the first listing to
# 2026-08-28. The icon.svg sitting in this directory is NOT what umbrelOS reads.
# GitHub raw links do not work either: text/plain + nosniff, browsers refuse them.
icon: https://peerloomllc.com/assets/icon-pearcinema.svg
tagline: Your films and shows, playable anywhere - and shareable with family
category: media
version: "1.1.3"
port: 8751
description: >-
  Watch the films and shows on your Umbrel from anywhere, without exposing your
  server to the internet.


  PearCinema connects your phone straight to this machine over an encrypted
  peer-to-peer connection (the Hypercore Protocol). No port forwarding, no VPN, no
  dynamic DNS, no account, and no copy of your library in anyone's cloud. Your files
  never leave your hardware: they stream through the live connection while they play,
  and you can skip to any point in a film without downloading it first.


  It reads your library where it already is. Point it at the Jellyfin or Emby you
  already run and it uses that - your posters, your descriptions, your seasons and
  episodes. Or point it at a plain folder of files and PearCinema reads them itself:
  it works out films from shows, sorts episodes into seasons, and picks up the
  descriptions and posters that Kodi, Sonarr or Radarr already left on the disk. That
  means a folder is a real library rather than a list of filenames - and it needs no
  internet lookup and no account with anyone, so nothing about what you own leaves
  this machine.


  YOU CAN ALSO JUST WATCH IT HERE. This dashboard is a player, so a laptop or a
  desktop on your network can open the library and start a film without installing
  anything at all.


  IT MAKES YOUR FILES PLAY, whatever they are. Files your phone can already handle go
  straight through untouched. Anything it cannot, this machine repackages or converts
  as it plays, using the graphics chip it has - Intel, AMD, NVIDIA or Apple - so it
  costs the processor almost nothing. Subtitles come along, including the picture
  subtitles from discs, which are drawn onto the film where a phone cannot show them
  by itself.


  KEEP A FILM FOR THE PLANE. Download it to a phone and it plays with everything
  switched off, converted in advance if that device needs it. On a train or in a car
  it works over mobile data too, at a lower quality so it does not eat a data plan.


  PUT IT ON THE TELEVISION. Cast to a Roku or a Samsung TV on your network and drive
  it from your phone, including from the lock screen. When an episode ends, the next
  one is offered.


  EVERYBODY GETS THEIR OWN PLACE IN IT. Where you stopped follows you from your phone
  to your laptop and back, and every person in the house has their own list rather
  than sharing yours. Have more than one machine running PearCinema? Pair with both
  and they look like one library.


  YOU decide who gets in. Every device that pairs appears here with a name it chose
  and a person it belongs to. Revoke a device and playback stops within seconds,
  mid-film - not "on next login". Revoke a person and every device they hold dies at
  once. There are no shared passwords or bearer tokens anywhere in the design: every
  connection is authenticated by the device's own key.


  That is what makes SHARING safe. Let a friend or a family member in and they get
  their own place here, with their own devices and their own place in whatever they
  were watching - and no login to pass around. Hand out a guest pass that expires by
  itself, or cut someone off the moment you want to. They never get a copy of a
  single file. If they want something you do not have, they can ask, and the ask
  arrives here.


  Pair a device by scanning the QR code on this dashboard with the PearCinema app.
developer: PeerLoom
website: https://peerloomllc.com
dependencies: []
repo: https://github.com/peerloomllc/pearcinema
support: https://github.com/peerloomllc/pearcinema/issues
# Full URLs, not filenames: umbrelOS renders a community app's gallery entry
# straight into an <img src> (CommunityAppStoreAppGalleryImage.vue), the same way
# it does the icon. Filenames only work for OFFICIAL-store apps, where it builds a
# CDN path from the app id.
gallery:
  - https://peerloomllc.com/assets/gallery-pearcinema-1.jpg
  - https://peerloomllc.com/assets/gallery-pearcinema-2.jpg
  - https://peerloomllc.com/assets/gallery-pearcinema-3.jpg
releaseNotes: |-
  New Features
  • Choose what each person can see. On the People page, every person now has a "Can see" line: tick the drives or folders they may watch, to any depth, and everything else disappears for them. Tick nothing and they see everything, as before. Films they have already downloaded stay on their phone.
  • Decide it when you invite them, not after. Pairing a new device now asks what it will be able to see before it shows you a code, so a device can be limited from the moment it joins. Handing over the whole library asks you to confirm.
  • The phone app works sideways, and on tablets. Turn it and the page fills the screen instead of staying a narrow column.
  Improvements
  • Films and TV shows with unusual filenames now get proper episode numbers. Anime numbered 01, 02, 03, files named only "E01", and several other naming styles were being filed with no episode number at all, so they could not be sorted or resumed.
  • Specials, OVAs and bonus episodes are now filed under "Specials" instead of sitting numberless, and creditless openings and disc menus no longer show up as episodes.
  • Films that cannot be read are now named on the dashboard. Previously a damaged or half-copied file simply never appeared in the library, with nothing said anywhere.
  • Converting on an NVIDIA graphics card now works with the drivers Linux Mint and Ubuntu ship. The bundled converter needed a newer driver than those systems offer.
  • When the video engine test fails, the page now shows what each graphics option said, in plain words, instead of one unexplained error.
  • A television waiting on its Media Assistant channel is now named in the phone's TV picker, with the one step needed to fix it.
  • Changes to what somebody can see reach their phone in about a second, without needing to refresh.
  Security
  • The file holding this machine's private key for reaching other libraries is no longer readable by other users on the same computer. Reported by a user; it is tightened automatically the next time PearCinema starts.
path: ""
defaultUsername: ""
# umbrelOS replaces defaultPassword with the derived value when this is set - it is
# the ONLY supported way to show a generated password. `defaultPassword: $APP_PASSWORD`
# was never a token umbrelOS substitutes: the compose DOES get the real value, so the
# app worked, but the UI printed the literal string "$APP_PASSWORD" and nobody could
# log in (found on a real PearTune store install, 2026-07-31).
deterministicPassword: true
submitter: PeerLoom
submission: https://github.com/peerloomllc/pearcinema
