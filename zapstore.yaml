# THESE SHOW REAL FILMS, AND THAT IS TIM'S CALL RATHER THAN AN OVERSIGHT (2026-08-28).
#
# The library frames are a grid of real cover art - 2001, 300, The Amazing Spider-Man,
# Annihilation, Army of Darkness - captured from a real 3 TB library. It was put to him
# with the alternative, and he chose to ship them.
#
# WHY IT IS DEFENSIBLE: a media player's screenshots showing media is what the app does,
# and Plex, Jellyfin and Infuse all ship listings of exactly this shape. A grid of grey
# rectangles would show nothing about the product.
#
# WHY THE SIBLING WENT THE OTHER WAY, so nobody reads this as ignorance of it: PearTune's
# zapstore.yaml explains that its first listing shipped with no pictures because real
# commercial ALBUM art "cannot live in a public MIT repo", and it was fixed by inventing a
# library - scripts/make-screenshot-fixture.js draws 40 albums belonging to nobody. That
# route stays open here and is in TODO.md; it is a different answer to the same question,
# not a correction to this one.
#
# THE SAME FRAMES are in the Play listing and, as of 2026-08-28, in App Store Connect for
# 1.1.0 - so this file is consistent with what the other two stores already show rather
# than a fourth opinion.

