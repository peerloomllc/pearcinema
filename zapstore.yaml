# NO `images:` BLOCK, AND THAT IS A DECISION RATHER THAN AN OMISSION.
#
# PearTune's own zapstore.yaml carries the reasoning for the sibling case: its first
# listing went up with no pictures because the only screenshots that existed rendered REAL
# commercial album art out of a real library, which cannot live in a public MIT repo. It
# was fixed by INVENTING a library - scripts/make-screenshot-fixture.js draws 40 albums
# belonging to nobody - and pointing this file at the framed output.
#
# PearCinema's committed frames under metadata/store/android/ are the same shape of
# problem and worse: they are a grid of real film posters (2001, 300, The Amazing
# Spider-Man, Annihilation, Army of Darkness) captured from Tim's own library. Pointing a
# public listing at them would be publishing that artwork from this repo.
#
# So the listing ships without pictures rather than with those, which is the lesser of the
# two faults and the one that is reversible. The fix is PearTune's: a fixture library of
# invented titles and artwork that belongs to nobody, captured and framed the same way.
# Logged in TODO.md.

